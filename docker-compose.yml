services:
  postgres:
    image: postgres:16-alpine
    container_name: sql-detective-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sql_detective}
      POSTGRES_USER: ${POSTGRES_USER:-sql_detective}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sql_detective}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
